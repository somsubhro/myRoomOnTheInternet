<aside class="post-toc" aria-label="Posts">
  <h2 class="post-toc-heading">Posts</h2>
  {%- assign posts_by_year = site.posts | group_by_exp: "post", "post.date | date: '%Y'" -%}
  {%- for year in posts_by_year -%}
  <h3 class="post-toc-year">{{ year.name }}</h3>
  <ul class="post-toc-list">
    {%- for post in year.items -%}
    <li>
      <a href="{{ post.url | relative_url }}"{% if post.url == page.url %} aria-current="page"{% endif %}>{{ post.title | escape }}</a>
      <span class="post-toc-date">{{ post.date | date: "%b %-d" }}</span>
    </li>
    {%- endfor -%}
  </ul>
  {%- endfor -%}
</aside>

<style>
  /* Two columns: content plus a sticky posts sidebar. Minima caps .wrapper at 800px. */
  .wrapper.has-toc {
    max-width: 1100px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 240px;
    gap: 48px;
    align-items: start;
  }
  .post-toc {
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    font-size: 14px;
    border-left: 1px solid #e8e8e8;
    padding-left: 20px;
  }
  .post-toc-heading {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .post-toc-year {
    font-size: 13px;
    font-weight: 600;
    color: #828282;
    margin: 14px 0 6px;
  }
  .post-toc-list {
    list-style: none;
    margin: 0;
  }
  .post-toc-list li {
    margin-bottom: 8px;
    line-height: 1.35;
  }
  .post-toc-list a {
    display: block;
    color: #111;
  }
  .post-toc-list a:hover {
    color: #2a7ae2;
  }
  .post-toc-list a[aria-current="page"] {
    color: #2a7ae2;
    font-weight: 600;
  }
  .post-toc-date {
    font-size: 12px;
    color: #828282;
  }
  /* On the home page the sidebar replaces Minima's post list at the bottom. */
  .is-home .post-list-heading,
  .is-home .post-list {
    display: none;
  }

  /* Narrow screens: single column. Posts get the list after the article; home keeps Minima's own list. */
  @media screen and (max-width: 800px) {
    .wrapper.has-toc {
      display: block;
    }
    .post-toc {
      position: static;
      max-height: none;
      border-left: none;
      border-top: 1px solid #e8e8e8;
      padding: 20px 0 0;
      margin-top: 30px;
    }
    .is-home .post-toc {
      display: none;
    }
    .is-home .post-list-heading,
    .is-home .post-list {
      display: block;
    }
  }
</style>
