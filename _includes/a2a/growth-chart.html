<script>
  (function () {
    var fig = document.getElementById("a2a-growth");
    if (!fig || !window.matchMedia || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var button = fig.querySelector(".viz-replay");
    function play() {
      fig.classList.remove("is-playing");
      void fig.offsetWidth; /* restart the CSS animation */
      fig.classList.add("is-playing");
    }
    fig.classList.add("is-ready");
    button.hidden = false;
    button.addEventListener("click", play);
    if ("IntersectionObserver" in window) {
      var seen = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) { play(); seen.disconnect(); }
      }, { threshold: 0.35 });
      seen.observe(fig);
    } else {
      play();
    }
  })();
</script>
